name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, Main]
  pull_request:
    branches: [main, Main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_DIR: build

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find Source Tests \
            \( -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

  tests:
    name: Tests (${{ matrix.name }})
    needs: format
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
          - name: linux-x64
            runner: ubuntu-latest
          - name: macos-arm64
            runner: macos-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch SpectraDsp
        id: spectra
        shell: bash
        env:
          SPECTRA_DSP_TOKEN: ${{ secrets.SPECTRA_DSP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python scripts/fetch_spectra_dsp.py --dest "$RUNNER_TEMP/spectra" --require >> "$GITHUB_OUTPUT"
          else
            python scripts/fetch_spectra_dsp.py --dest "$RUNNER_TEMP/spectra" >> "$GITHUB_OUTPUT"
          fi

      - name: Install JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            mesa-common-dev \
            libjack-jackd2-dev \
            libdbus-1-dev

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          SPECTRA_DSP_PATH: ${{ steps.spectra.outputs.library }}
        run: install.bat test

      - name: Run tests (Linux and macOS)
        if: runner.os != 'Windows'
        env:
          SPECTRA_DSP_PATH: ${{ steps.spectra.outputs.library }}
        run: |
          chmod +x ./install.sh
          ./install.sh test

      - name: Test Linux installer packaging
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/linux/build-run.sh packaging/linux/install.sh
          python packaging/test_build_installer.py

      - name: Summarize audio metrics
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("build/audio-metrics.json")
          if not path.is_file():
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding="utf-8"))
          lines = [
              "## Profiler audio (48 kHz)",
              "",
              "| name | unit | value |",
              "| --- | --- | --- |",
          ]
          for row in data:
              lines.append(f"| {row.get('name', '')} | {row.get('unit', '')} | {row.get('value', '')} |")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload audio metrics
        if: always() && matrix.name == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: audio-metrics
          path: build/audio-metrics.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: ignore
          path: build/Testing/

  audio-history:
    name: Audio history
    needs: tests
    if: always() && needs.tests.result != 'cancelled' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure gh-pages exists
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --heads origin gh-pages; then
            empty=$(git hash-object -t tree /dev/null)
            sha=$(git commit-tree "$empty" -m "Initialize gh-pages")
            git push origin "$sha":refs/heads/gh-pages
          fi

      - name: Download audio metrics
        id: metrics
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: audio-metrics
          if-no-artifact-found: ignore

      - name: Locate audio metrics
        id: locate
        run: |
          set -euo pipefail
          if [[ -f audio-metrics.json ]]; then
            echo "path=audio-metrics.json" >> "$GITHUB_OUTPUT"
          elif [[ -f build/audio-metrics.json ]]; then
            echo "path=build/audio-metrics.json" >> "$GITHUB_OUTPUT"
          else
            echo "No audio-metrics artifact; skipping history."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish audio history
        if: steps.locate.outputs.path != ''
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Profiler audio
          tool: customSmallerIsBetter
          output-file-path: ${{ steps.locate.outputs.path }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          comment-on-alert: true
          summary-always: true
          fail-on-alert: false
          alert-threshold: '150%'
          max-items-in-chart: 200

      - name: Enable GitHub Pages
        if: steps.locate.outputs.path != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          output=$(gh api --method POST "repos/${{ github.repository }}/pages" -f source[branch]=gh-pages -f source[path]=/ 2>&1)
          status=$?
          echo "$output"
          if [[ $status -eq 0 || "$output" == *409* ]]; then
            exit 0
          fi
          if [[ "$output" == *403* ]]; then
            echo "Enable Pages from Settings, Pages, Deploy from branch, gh-pages, root folder."
            echo "Charts: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/dev/bench/"
          fi
          exit 0

  coverage:
    name: Coverage
    needs: format
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenCppCoverage
        shell: cmd
        run: choco install opencppcoverage --no-progress -y

      - name: Run tests with coverage
        shell: cmd
        run: install.bat test --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          retention-days: 14
          if-no-files-found: error
          path: |
            build/coverage/coverage.xml
            build/coverage/html/

  build:
    name: Build (${{ matrix.name }})
    needs: format
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            require_spectra: "true"
          - name: windows-arm64
            runner: windows-11-arm
            require_spectra: "false"
          - name: linux-x64
            runner: ubuntu-latest
            require_spectra: "true"
          - name: macos-arm64
            runner: macos-latest
            require_spectra: "true"

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch SpectraDsp
        id: spectra
        shell: bash
        env:
          SPECTRA_DSP_TOKEN: ${{ secrets.SPECTRA_DSP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ matrix.require_spectra }}" == "true" && ( "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "workflow_dispatch" ) ]]; then
            python scripts/fetch_spectra_dsp.py --dest "$RUNNER_TEMP/spectra" --require >> "$GITHUB_OUTPUT"
          else
            python scripts/fetch_spectra_dsp.py --dest "$RUNNER_TEMP/spectra" >> "$GITHUB_OUTPUT"
          fi

      - name: Install JUCE dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            mesa-common-dev \
            libjack-jackd2-dev \
            libdbus-1-dev

      - name: Build project (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: install.bat build

      - name: Build project (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./install.sh
          ./install.sh build

      - name: Stage SpectraDsp into plugin bundles
        if: steps.spectra.outputs.library != ''
        shell: bash
        run: python scripts/stage_spectra_dsp.py --library "${{ steps.spectra.outputs.library }}" --plugin-root build/bin

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: cmd
        run: choco install innosetup --no-progress -y

      - name: Install makeself
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y makeself

      - name: Build Spectra installer
        shell: bash
        run: |
          chmod +x packaging/macos/build-pkg.sh packaging/linux/build-run.sh packaging/linux/install.sh
          python packaging/build_installer.py \
            --plugin-root build/bin \
            --os-arch "${{ matrix.name }}" \
            --output-dir dist \
            --version "0.0.${{ github.run_number }}"

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            build/bin/lib/VST3/**
            build/bin/lib/AU/**
            build/bin/Standalone/**

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: dist/Spectra-*

  release:
    name: Publish Release
    needs: [tests, coverage, build]
    # Manual only. Merging to main runs the checks above and does not publish.
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Main')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts/

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers/
          merge-multiple: true

      - name: Normalize artifact structure
        run: |
          mkdir -p release-package
          for dir in artifacts/build-*/; do
            os_arch=$(basename "$dir" | sed 's/^build-//')
            mkdir -p "release-package/$os_arch"
            cp -r "$dir"* "release-package/$os_arch/"
          done
          mkdir -p release-installers
          find installers -type f \( -name 'Spectra-*.exe' -o -name 'Spectra-*.pkg' -o -name 'Spectra-*.run' \) -exec cp {} release-installers/ \;
          ls -la release-installers

      - name: Create release archives
        run: |
          cd release-package
          for dir in */; do
            os_arch="${dir%/}"
            if [[ "$os_arch" == windows-* ]]; then
              zip -r "../${os_arch}.zip" "$dir"
            else
              tar -czf "../${os_arch}.tar.gz" "$dir"
            fi
          done

      - name: Read bundled SpectraDsp version
        id: engine
        run: |
          set -euo pipefail
          version_file=$(find artifacts -name SPECTRA_DSP_VERSION.txt -print -quit)
          if [[ -z "$version_file" ]]; then
            echo "SpectraDsp was not bundled into the build artifacts."
            exit 1
          fi
          version=$(tr -d '[:space:]' < "$version_file")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate version tag
        id: version
        run: |
          echo "tag=v$(date +'%Y.%m.%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            Bundled SpectraDsp `${{ steps.engine.outputs.version }}`.

            Installers (standalone and/or plugin, chosen in the installer UI):
            - Windows x64: `Spectra-windows-x64.exe`
            - Windows ARM64: `Spectra-windows-arm64.exe`
            - macOS Apple Silicon: `Spectra-macos-arm64.pkg` (not notarized)
            - Linux x64: `Spectra-linux-x64.run`

            https://spectradsp.com points at this latest release.
          generate_release_notes: true
          files: |
            *.zip
            *.tar.gz
            release-installers/Spectra-*.exe
            release-installers/Spectra-*.pkg
            release-installers/Spectra-*.run
